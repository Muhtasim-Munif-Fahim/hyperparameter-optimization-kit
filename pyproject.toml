[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperopt-kit"
version = "0.1.0"
description = "A lightweight hyperparameter optimization toolkit with grid, random and Gaussian-process bayesian search."
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.scripts]
hyperopt-kit = "hyperopt_kit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:inline_snapshot"
pythonpath = ["src"]
